level = "required"
text = "Confirm the requested outcome, assumptions, and acceptance criteria before implementation."

[[rules]]
id = "common.read-before-editing"
level = "required"
text = "Inspect target files, callers, tests, and shared utilities before editing."

[[rules]]
id = "common.minimal-change"
level = "required"
text = "Make the smallest sufficient change and preserve unrelated user work."

