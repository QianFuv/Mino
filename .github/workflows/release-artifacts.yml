name: Native plugin artifact validation

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/release-artifacts.yml"
      - "assets/skill/mino/**"
      - "plugins/mino/**"
      - "src/distribution/**"
      - "src/bin/xtask.rs"
      - "tests/e2e_v0_1.rs"
      - "tests/e2e_v0_3.rs"
      - "tests/plugin_contract.rs"
      - "Cargo.toml"
      - "Cargo.lock"
      - "LICENSE-*"

permissions:
  contents: read

jobs:
  package:
    name: Package ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
            binary: target/release/mino.exe
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            binary: target/release/mino
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            binary: target/release/mino
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            binary: target/release/mino
          - runner: macos-15
            target: aarch64-apple-darwin
            binary: target/release/mino
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust 1.96.1
        run: rustup toolchain install 1.96.1 --profile minimal
      - name: Select Rust 1.96.1
        run: rustup default 1.96.1
      - name: Fetch locked dependencies
        run: cargo fetch --locked
      - name: Validate canonical plugin contract
        env:
          CARGO_PROFILE_DEV_DEBUG: "0"
          CARGO_PROFILE_TEST_DEBUG: "0"
        run: |
          cargo build --locked --bin mino
          cargo test --locked --test plugin_contract -- --test-threads=1
      - name: Build native Mino binary
        run: cargo build --release --locked --bin mino
      - name: Assemble and smoke native artifact
        run: >-
          cargo run --release --locked --bin xtask -- package-plugin
          --repository .
          --binary "${{ matrix.binary }}"
          --target "${{ matrix.target }}"
          --output dist
      - name: Validate checksums and extract final archive
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $targetDirectory = Join-Path "dist" "${{ matrix.target }}"
          $manifestPath = Join-Path $targetDirectory "artifact-manifest.json"
          $checksumsPath = Join-Path $targetDirectory "SHA256SUMS"
          $archives = @(Get-ChildItem -LiteralPath $targetDirectory -Filter "*.zip" -File)
          if ($archives.Count -ne 1) {
            throw "Expected exactly one final ZIP in $targetDirectory"
          }
          $archive = $archives[0]
          $checksums = @{}
          foreach ($line in Get-Content -LiteralPath $checksumsPath) {
            if ($line -notmatch '^([0-9a-f]{64})  (.+)$') {
              throw "Non-canonical SHA256SUMS line: $line"
            }
            $checksums[$Matches[2]] = $Matches[1]
          }
          foreach ($artifactPath in @($archive.FullName, $manifestPath)) {
            $artifactName = Split-Path -Leaf $artifactPath
            $actual = (Get-FileHash -Algorithm SHA256 -LiteralPath $artifactPath).Hash.ToLowerInvariant()
            if (-not $checksums.ContainsKey($artifactName) -or $checksums[$artifactName] -ne $actual) {
              throw "Checksum mismatch for $artifactName"
            }
          }
          $manifest = Get-Content -Raw -LiteralPath $manifestPath | ConvertFrom-Json
          $archiveDigest = "sha256:" + (Get-FileHash -Algorithm SHA256 -LiteralPath $archive.FullName).Hash.ToLowerInvariant()
          if ($manifest.archive.file -ne $archive.Name -or $manifest.archive.digest -ne $archiveDigest) {
            throw "Manifest archive identity does not match the final ZIP"
          }
          $extractRoot = Join-Path $env:RUNNER_TEMP "mino-final-${{ matrix.target }}"
          if (Test-Path -LiteralPath $extractRoot) {
            throw "Final archive extraction root already exists: $extractRoot"
          }
          Expand-Archive -LiteralPath $archive.FullName -DestinationPath $extractRoot
          $binaryName = Split-Path -Leaf "${{ matrix.binary }}"
          $relativeBinary = "mino/bin/$binaryName"
          $binaryPath = Join-Path (Join-Path (Join-Path $extractRoot "mino") "bin") $binaryName
          $binaryPath = (Resolve-Path -LiteralPath $binaryPath).Path
          if (-not $IsWindows) {
            & chmod 755 $binaryPath
            if ($LASTEXITCODE -ne 0) {
              throw "Failed to make the archived binary executable"
            }
          }
          $entries = @($manifest.files | Where-Object { $_.path -eq $relativeBinary })
          if ($entries.Count -ne 1) {
            throw "Manifest must contain exactly one $relativeBinary entry"
          }
          $binaryDigest = "sha256:" + (Get-FileHash -Algorithm SHA256 -LiteralPath $binaryPath).Hash.ToLowerInvariant()
          if ($entries[0].digest -ne $binaryDigest) {
            throw "Extracted binary digest does not match the archive manifest"
          }
          Add-Content -Encoding utf8 -LiteralPath $env:GITHUB_ENV -Value "MINO_E2E_BINARY=$binaryPath"
          Add-Content -Encoding utf8 -LiteralPath $env:GITHUB_ENV -Value "MINO_E2E_PROFILE=release-artifact"
          Add-Content -Encoding utf8 -LiteralPath $env:GITHUB_ENV -Value "MINO_E2E_EXPECTED_DIGEST=$binaryDigest"
          Write-Output "mino-archive-proof archive=$archiveDigest path=$binaryPath profile=release-artifact digest=$binaryDigest"
      - name: Run final-archive lifecycle
        run: cargo test --release --locked --offline --test e2e_v0_1 -- --test-threads=1 --nocapture
