name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  stable:
    name: Stable (Windows)
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust 1.96.1
        run: rustup toolchain install 1.96.1 --profile minimal --component rustfmt --component clippy
      - name: Select Rust 1.96.1
        run: rustup default 1.96.1
      - name: Install nightly Miri
        run: rustup toolchain install nightly --profile minimal --component miri
      - name: Install cargo-sort
        run: cargo install cargo-sort --version 2.1.3 --locked
      - name: Fetch locked dependencies
        run: cargo fetch --locked
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Run Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Check dependency ordering
        run: cargo sort --check
      - name: Prepare Miri
        run: cargo +nightly miri setup
      - name: Run Miri library tests
        run: cargo +nightly miri test --lib
      - name: Install Mino offline
        run: cargo install --path . --root "${{ runner.temp }}/mino-install" --locked --offline --debug
      - name: Verify installed binary
        shell: pwsh
        run: '& "${{ runner.temp }}/mino-install/bin/mino.exe" --version'
      - name: Run installed-binary lifecycle
        env:
          MINO_E2E_BINARY: ${{ runner.temp }}/mino-install/bin/mino.exe
        run: cargo test --offline --test e2e_v0_1 -- --test-threads=1
      - name: Run all tests
        env:
          MINO_E2E_BINARY: ${{ runner.temp }}/mino-install/bin/mino.exe
        run: cargo test --offline --all-targets --all-features
      - name: Build warning-free documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --offline --all-features --no-deps
