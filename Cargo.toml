[package]
name = "mino"
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
description = "A local plan protocol engine for coding agents"
license = "MIT OR Apache-2.0"

[dependencies]
cap-std = "4"
clap = { version = "4", features = ["derive"] }
command-group = "5"
fs4 = { version = "1.1", features = ["sync"] }
ignore = "0.4"
regex = "1"
schemars = "1"
semver = "1"
serde = { version = "1", features = ["derive"] }
serde-saphyr = { version = "0.0.27", default-features = false, features = ["deserialize"] }
serde_json = "1"
sha2 = "0.10"
time = { version = "0.3.48", features = ["formatting", "parsing"] }
toml = "0.9"
ureq = { version = "3", default-features = false, features = ["rustls"] }
zip = { version = "8.6", default-features = false }

[lints.rust]
missing_docs = "deny"
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
pedantic = "warn"
