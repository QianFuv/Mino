[package]
name = "mino"
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
description = "A local plan protocol engine for coding agents"
license = "MIT OR Apache-2.0"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lints.rust]
missing_docs = "deny"
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
pedantic = "warn"
